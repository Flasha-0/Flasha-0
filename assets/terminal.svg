<svg width="1400" height="340" viewBox="0 0 1400 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="1400" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>

    <linearGradient id="fl-accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="55%" stop-color="#C24F73"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="340" rx="28" fill="url(#fl-bg)"/>

  <!-- Frame -->
  <rect x="26" y="22" width="1348" height="296" rx="20" fill="#0D090C" stroke="#2A1823" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="26" y="22" width="1348" height="42" rx="20" fill="#171016"/>
  <circle cx="55" cy="43" r="6" fill="#8B1E47"/>
  <circle cx="78" cy="43" r="6" fill="#B8922A"/>
  <circle cx="101" cy="43" r="6" fill="#5C4A52"/>

  <text x="700" y="48" text-anchor="middle" fill="#8A7280" font-size="14" font-family="Consolas, Monaco, monospace" letter-spacing="2">
    FLASHA // ROOT TERMINAL // CRIMSON INK v7.0
  </text>

  <!-- Grid -->
  <g opacity="0.05" stroke="#8B1E47" stroke-width="1">
    <line x1="60" y1="100" x2="1340" y2="100"/>
    <line x1="60" y1="150" x2="1340" y2="150"/>
    <line x1="60" y1="200" x2="1340" y2="200"/>
    <line x1="60" y1="250" x2="1340" y2="250"/>
    <line x1="60" y1="300" x2="1340" y2="300"/>
    <line x1="260" y1="78" x2="260" y2="300"/>
    <line x1="520" y1="78" x2="520" y2="300"/>
    <line x1="780" y1="78" x2="780" y2="300"/>
    <line x1="1040" y1="78" x2="1040" y2="300"/>
  </g>

  <!-- Glow Orb -->
  <circle cx="1180" cy="120" r="100" fill="#8B1E47" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1240" cy="230" r="85" fill="#B8922A" opacity="0.06" filter="url(#glow)"/>

  <!-- Prompt Lines -->
  <g font-family="Consolas, Monaco, monospace">
    <text x="72" y="102" fill="#B8922A" font-size="24">$ whoami</text>
    <text x="250" y="102" fill="#F2EAF0" font-size="24">Flasha 🎴</text>

    <text x="72" y="142" fill="#B8922A" font-size="24">$ class --render</text>
    <text x="340" y="142" fill="#C4A8B8" font-size="22">Video Editor • Graphic Designer • Angry Dubber • Vibe Coder</text>

    <text x="72" y="182" fill="#B8922A" font-size="24">$ status --signal</text>
    <text x="350" y="182" fill="#F2EAF0" font-size="22">Transmission stable · Controlled rebellion online</text>

    <text x="72" y="222" fill="#B8922A" font-size="24">$ pillars --list</text>
    <text x="320" y="222" fill="#C24F73" font-size="22">Cinematic Rage</text>
    <text x="560" y="222" fill="#B8922A" font-size="22">Glass Architecture</text>
    <text x="860" y="222" fill="#F2EAF0" font-size="22">Angry Dubbing</text>
    <text x="1090" y="222" fill="#C4A8B8" font-size="22">Vibe Coding</text>

    <text x="72" y="268" fill="#B8922A" font-size="24">$ boot --theme</text>
    <text x="320" y="268" fill="url(#fl-accent)" font-size="24" filter="url(#glow)">CRIMSON INK // GLASS RITUAL // ACTIVE</text>
  </g>

  <!-- Side Card -->
  <rect x="1030" y="86" width="290" height="170" rx="18" fill="#140D12" stroke="#3B2432"/>
  <text x="1175" y="118" text-anchor="middle" fill="#B8922A" font-size="16" font-family="Consolas, Monaco, monospace" letter-spacing="2">
    SYSTEM STATUS
  </text>

  <text x="1060" y="152" fill="#8A7280" font-size="14" font-family="Consolas, Monaco, monospace">ENGINE</text>
  <text x="1288" y="152" text-anchor="end" fill="#F2EAF0" font-size="14" font-family="Consolas, Monaco, monospace">ONLINE</text>

  <text x="1060" y="182" fill="#8A7280" font-size="14" font-family="Consolas, Monaco, monospace">AESTHETIC</text>
  <text x="1288" y="182" text-anchor="end" fill="#C24F73" font-size="14" font-family="Consolas, Monaco, monospace">CRIMSON INK</text>

  <text x="1060" y="212" fill="#8A7280" font-size="14" font-family="Consolas, Monaco, monospace">MODE</text>
  <text x="1288" y="212" text-anchor="end" fill="#B8922A" font-size="14" font-family="Consolas, Monaco, monospace">PRO MAX</text>

  <text x="1060" y="242" fill="#8A7280" font-size="14" font-family="Consolas, Monaco, monospace">SIGNAL</text>
  <text x="1288" y="242" text-anchor="end" fill="#F2EAF0" font-size="14" font-family="Consolas, Monaco, monospace">TRANSMITTING</text>

  <!-- Bottom rule -->
  <rect x="70" y="292" width="1260" height="2" rx="1" fill="url(#fl-accent)" opacity="0.35"/>
</svg>
