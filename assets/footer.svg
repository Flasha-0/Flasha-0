<svg width="1400" height="140" viewBox="0 0 1400 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ft-line" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="20%" stop-color="#8B1E47"/>
      <stop offset="50%" stop-color="#C24F73"/>
      <stop offset="80%" stop-color="#B8922A"/>
      <stop offset="100%" stop-color="#110D10"/>
    </linearGradient>
    <linearGradient id="ft-chip" x1="0" y1="0" x2="460" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1018"/>
      <stop offset="100%" stop-color="#140D12"/>
    </linearGradient>
    <filter id="ft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="140" rx="28" fill="#110D10"/>

  <!-- Lines -->
  <line x1="60" y1="70" x2="440" y2="70" stroke="url(#ft-line)" stroke-width="1.5" opacity="0.5"/>
  <line x1="960" y1="70" x2="1340" y2="70" stroke="url(#ft-line)" stroke-width="1.5" opacity="0.5"/>

  <!-- Center Chip -->
  <rect x="460" y="30" width="480" height="80" rx="40" fill="url(#ft-chip)" stroke="#3A2431" stroke-width="1.2"/>

  <text x="700" y="62" text-anchor="middle" fill="#F2EAF0" font-size="22" font-family="Arial, sans-serif" font-weight="800" filter="url(#ft-glow)" letter-spacing="2">
    CRAFTED BY FLASHA 🎴
  </text>

  <text x="700" y="88" text-anchor="middle" fill="#B8922A" font-size="11" font-family="Consolas, Monaco, monospace" letter-spacing="4">
    OBSIDIAN PROTOCOL · CRIMSON INK · v8.0
  </text>

  <!-- Corner dots -->
  <circle cx="40" cy="70" r="3" fill="#8B1E47" opacity="0.4"/>
  <circle cx="1360" cy="70" r="3" fill="#B8922A" opacity="0.4"/>
</svg>
