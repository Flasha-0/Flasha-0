<svg width="1400" height="320" viewBox="0 0 1400 320"
     fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1400" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8B1E47"/>
      <stop offset="55%"  stop-color="#C24F73"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8B1E47"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
    <filter id="glow-text" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clip-card">
      <rect width="1400" height="320" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1400" height="320" rx="28" fill="url(#bg-grad)"/>

  <!-- Grid Lines -->
  <g clip-path="url(#clip-card)" opacity="0.04" stroke="#8B1E47" stroke-width="1">
    <line x1="0"    y1="64"  x2="1400" y2="64"/>
    <line x1="0"    y1="128" x2="1400" y2="128"/>
    <line x1="0"    y1="192" x2="1400" y2="192"/>
    <line x1="0"    y1="256" x2="1400" y2="256"/>
    <line x1="200"  y1="0"   x2="200"  y2="320"/>
    <line x1="400"  y1="0"   x2="400"  y2="320"/>
    <line x1="600"  y1="0"   x2="600"  y2="320"/>
    <line x1="800"  y1="0"   x2="800"  y2="320"/>
    <line x1="1000" y1="0"   x2="1000" y2="320"/>
    <line x1="1200" y1="0"   x2="1200" y2="320"/>
  </g>

  <!-- Orbs -->
  <ellipse cx="180" cy="160" rx="220" ry="180" fill="#8B1E47" filter="url(#glow-orb)" opacity="0.18"/>
  <ellipse cx="1220" cy="160" rx="200" ry="160" fill="#B8922A" filter="url(#glow-orb)" opacity="0.13"/>

  <!-- Rotating Ring -->
  <g transform="translate(160,160)">
    <circle r="72" stroke="#8B1E47" stroke-width="1" opacity="0.2" fill="none"/>
    <circle r="72" stroke="url(#ring-grad)" stroke-width="2.5" fill="none"
            stroke-dasharray="90 362" stroke-linecap="round"
            transform-origin="0 0">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" stroke="#B8922A" stroke-width="0.8" opacity="0.12" fill="none"/>
  </g>

  <!-- Card Emoji -->
  <text x="160" y="178" font-size="56" text-anchor="middle"
        dominant-baseline="middle">🎴</text>

  <!-- Main Title -->
  <text x="700" y="155" font-family="'Arial Black', sans-serif"
        font-size="96" font-weight="900" text-anchor="middle"
        fill="url(#text-grad)" filter="url(#glow-text)"
        letter-spacing="-3">FLASHA</text>

  <!-- Subtitle -->
  <text x="700" y="210" font-family="'Courier New', monospace"
        font-size="15" text-anchor="middle" fill="#B8922A"
        letter-spacing="8" opacity="0.85">
    DESIGN SIGNATURE SYSTEM · v5.0
  </text>

  <!-- Divider Line -->
  <line x1="420" y1="238" x2="980" y2="238" stroke="#8B1E47"
        stroke-width="0.8" opacity="0.4"/>

  <!-- Tags -->
  <text x="700" y="268" font-family="'Arial', sans-serif"
        font-size="13" text-anchor="middle" fill="#C4A8B8"
        letter-spacing="3" opacity="0.75">
    VIDEO EDITOR · GRAPHIC DESIGNER · ANGRY DUBBER · VIBE CODER
  </text>

  <!-- Corner Marks -->
  <g stroke="#B8922A" stroke-width="1.2" opacity="0.35">
    <path d="M32 14 L14 14 L14 32"/>
    <path d="M1368 14 L1386 14 L1386 32"/>
    <path d="M32 306 L14 306 L14 288"/>
    <path d="M1368 306 L1386 306 L1386 288"/>
  </g>

  <!-- Bottom Badge -->
  <rect x="580" y="288" width="240" height="22" rx="11"
        fill="#8B1E47" opacity="0.15"/>
  <text x="700" y="303" font-family="'Courier New', monospace"
        font-size="10" text-anchor="middle" fill="#B8922A"
        letter-spacing="4" opacity="0.7">CRIMSON INK EDITION</text>
</svg>
