<svg width="1400" height="280" viewBox="0 0 1400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl-bg" x1="0" y1="0" x2="1400" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>
    <linearGradient id="pl-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="100%" stop-color="#C24F73"/>
    </linearGradient>
    <linearGradient id="pl-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#947219"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
    <linearGradient id="pl-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B1538"/>
      <stop offset="100%" stop-color="#8B1E47"/>
    </linearGradient>
    <linearGradient id="pl-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8922A"/>
      <stop offset="100%" stop-color="#E6C467"/>
    </linearGradient>
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="280" rx="28" fill="url(#pl-bg)"/>

  <!-- Header -->
  <line x1="60" y1="40" x2="320" y2="40" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>
  <text x="340" y="46" fill="#B8922A" font-size="14" font-family="Consolas, Monaco, monospace" letter-spacing="6">THE FOUR PILLARS</text>
  <line x1="600" y1="40" x2="1340" y2="40" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>

  <!-- Pillar 1: Cinematic Rage -->
  <g>
    <rect x="50" y="72" width="320" height="180" rx="20" fill="#140D12" stroke="#3A2431" stroke-width="1.2"/>
    <rect x="50" y="72" width="6" height="180" rx="3" fill="url(#pl-1)"/>
    
    <!-- Icon Circle -->
    <circle cx="100" cy="120" r="28" fill="#1A1018" stroke="url(#pl-1)" stroke-width="2"/>
    <!-- Play/Film Icon -->
    <path d="M 92 110 L 92 130 L 112 120 Z" fill="#C24F73" filter="url(#pl-glow)"/>
    
    <!-- Number -->
    <text x="340" y="108" text-anchor="end" fill="#3A2431" font-size="48" font-family="Arial Black, sans-serif" font-weight="900">01</text>
    
    <text x="80" y="180" fill="#F2EAF0" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">CINEMATIC</text>
    <text x="80" y="202" fill="#C24F73" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">RAGE</text>
    
    <line x1="80" y1="216" x2="340" y2="216" stroke="#2A1823"/>
    
    <text x="80" y="238" fill="#8A7280" font-size="11" font-family="Consolas, Monaco, monospace">Video editing • Motion design</text>
  </g>

  <!-- Pillar 2: Glass Architecture -->
  <g>
    <rect x="385" y="72" width="320" height="180" rx="20" fill="#140D12" stroke="#3A2431" stroke-width="1.2"/>
    <rect x="385" y="72" width="6" height="180" rx="3" fill="url(#pl-2)"/>
    
    <circle cx="435" cy="120" r="28" fill="#1A1018" stroke="url(#pl-2)" stroke-width="2"/>
    <!-- Glass/Window Icon -->
    <rect x="423" y="108" width="24" height="24" rx="2" fill="none" stroke="#B8922A" stroke-width="2"/>
    <line x1="423" y1="120" x2="447" y2="120" stroke="#B8922A" stroke-width="1.5"/>
    <line x1="435" y1="108" x2="435" y2="132" stroke="#B8922A" stroke-width="1.5"/>
    
    <text x="675" y="108" text-anchor="end" fill="#3A2431" font-size="48" font-family="Arial Black, sans-serif" font-weight="900">02</text>
    
    <text x="415" y="180" fill="#F2EAF0" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">GLASS</text>
    <text x="415" y="202" fill="#B8922A" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">ARCHITECTURE</text>
    
    <line x1="415" y1="216" x2="675" y2="216" stroke="#2A1823"/>
    
    <text x="415" y="238" fill="#8A7280" font-size="11" font-family="Consolas, Monaco, monospace">Graphic design • Visual systems</text>
  </g>

  <!-- Pillar 3: Angry Dubbing -->
  <g>
    <rect x="720" y="72" width="320" height="180" rx="20" fill="#140D12" stroke="#3A2431" stroke-width="1.2"/>
    <rect x="720" y="72" width="6" height="180" rx="3" fill="url(#pl-3)"/>
    
    <circle cx="770" cy="120" r="28" fill="#1A1018" stroke="url(#pl-3)" stroke-width="2"/>
    <!-- Mic Icon -->
    <rect x="764" y="108" width="12" height="18" rx="6" fill="#8B1E47"/>
    <path d="M 760 124 Q 770 134 780 124" fill="none" stroke="#8B1E47" stroke-width="2"/>
    <line x1="770" y1="132" x2="770" y2="138" stroke="#8B1E47" stroke-width="2"/>
    
    <text x="1010" y="108" text-anchor="end" fill="#3A2431" font-size="48" font-family="Arial Black, sans-serif" font-weight="900">03</text>
    
    <text x="750" y="180" fill="#F2EAF0" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">ANGRY</text>
    <text x="750" y="202" fill="#8B1E47" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">DUBBING</text>
    
    <line x1="750" y1="216" x2="1010" y2="216" stroke="#2A1823"/>
    
    <text x="750" y="238" fill="#8A7280" font-size="11" font-family="Consolas, Monaco, monospace">Voice acting • Cultural rebellion</text>
  </g>

  <!-- Pillar 4: Vibe Coding -->
  <g>
    <rect x="1055" y="72" width="295" height="180" rx="20" fill="#140D12" stroke="#3A2431" stroke-width="1.2"/>
    <rect x="1055" y="72" width="6" height="180" rx="3" fill="url(#pl-4)"/>
    
    <circle cx="1105" cy="120" r="28" fill="#1A1018" stroke="url(#pl-4)" stroke-width="2"/>
    <!-- Code Icon -->
    <text x="1105" y="128" text-anchor="middle" fill="#E6C467" font-size="20" font-weight="700" font-family="Consolas, monospace">⌘</text>
    
    <text x="1320" y="108" text-anchor="end" fill="#3A2431" font-size="48" font-family="Arial Black, sans-serif" font-weight="900">04</text>
    
    <text x="1085" y="180" fill="#F2EAF0" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">VIBE</text>
    <text x="1085" y="202" fill="#E6C467" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">CODING</text>
    
    <line x1="1085" y1="216" x2="1320" y2="216" stroke="#2A1823"/>
    
    <text x="1085" y="238" fill="#8A7280" font-size="11" font-family="Consolas, Monaco, monospace">Web dev • Digital rituals</text>
  </g>
</svg>
