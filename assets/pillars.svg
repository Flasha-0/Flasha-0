    <text x="1068" y="215" font-size="14" fill="#C4A8B8" font-family="Arial, Helvetica, sans-serif">interactive layers • design systems • web theater</text>
    <text x="1068" y="242" font-size="14" fill="#C4A8B8" font-family="Arial, Helvetica, sans-serif">structure • motion logic • identity-driven code</text>

