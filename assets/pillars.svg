    <text x="1109" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">WEB UI</text>

    <rect x="1158" y="290" width="92" height="28" rx="14" fill="#201219" stroke="rgba(184,146,42,0.28)"/>
    <text x="1204" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">SYSTEM CORE</text>

    <text x="1068" y="345" font-size="12" fill="#8A7280" font-family="'Courier New', monospace" letter-spacing="2">OUTPUT / INTERFACE AS IDENTITY</text>
