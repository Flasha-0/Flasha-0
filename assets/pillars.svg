    <text x="450" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">BRANDING</text>

    <rect x="500" y="290" width="96" height="28" rx="14" fill="#201219" stroke="rgba(184,146,42,0.28)"/>
    <text x="548" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">UI SYSTEMS</text>

    <text x="408" y="345" font-size="12" fill="#8A7280" font-family="'Courier New', monospace" letter-spacing="2">OUTPUT / PREMIUM VISUAL STRUCTURE</text>
  </g>

