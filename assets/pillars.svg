    <text x="738" y="215" font-size="14" fill="#C4A8B8" font-family="Arial, Helvetica, sans-serif">voice tone • Arabic dub energy • emotional hit</text>
    <text x="738" y="242" font-size="14" fill="#C4A8B8" font-family="Arial, Helvetica, sans-serif">aggressive timing • expressive delivery • texture</text>

    <rect x="738" y="290" width="74" height="28" rx="14" fill="#201219" stroke="rgba(194,79,115,0.30)"/>
    <text x="775" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">VOICE</text>

    <rect x="820" y="290" width="96" height="28" rx="14" fill="#201219" stroke="rgba(194,79,115,0.30)"/>
    <text x="868" y="308" text-anchor="middle" font-size="11" fill="#F2EAF0" font-family="'Courier New', monospace">SOUND HIT</text>

    <text x="738" y="345" font-size="12" fill="#8A7280" font-family="'Courier New', monospace" letter-spacing="2">OUTPUT / VOICE WITH VOLTAGE</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="1040" y="112" width="300" height="260" rx="26" fill="#171016" stroke="rgba(184,146,42,0.24)"/>
    <rect x="1040" y="112" width="300" height="4" rx="2" fill="url(#accent)"/>
