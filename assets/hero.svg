<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E090D"/>
      <stop offset="55%" stop-color="#140D12"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="50%" stop-color="#C24F73"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D5618"/>
      <stop offset="50%" stop-color="#B8922A"/>
      <stop offset="100%" stop-color="#6D5618"/>
    </linearGradient>

    <filter id="blurXL" x="-50%" y="-50%" width="200%" height="200%">
