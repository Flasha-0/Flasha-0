<svg width="1400" height="300" viewBox="0 0 1400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="300" rx="20" fill="#0C080A"/>
  
  <!-- Terminal Header -->
  <rect width="1400" height="40" rx="10" fill="#1A1018"/>
  <circle cx="30" cy="20" r="6" fill="#8B1E47"/>
  <circle cx="55" cy="20" r="6" fill="#B8922A"/>
  <circle cx="80" cy="20" r="6" fill="#444"/>
  <text x="700" y="25" font-family="monospace" font-size="14" fill="#8A7280" text-anchor="middle">FLASH-OS v6.6.6 [ROOT ACCESS]</text>

  <!-- Glitch Text -->
  <g filter="url(#glow)">
    <text x="700" y="160" font-family="monospace" font-size="100" font-weight="900" fill="#8B1E47" text-anchor="middle" letter-spacing="-5">FLASHA_</text>
    <text x="702" y="158" font-family="monospace" font-size="100" font-weight="900" fill="#B8922A" text-anchor="middle" letter-spacing="-5" opacity="0.5">
        <animate attributeName="opacity" values="0;0.5;0" dur="0.2s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Terminal Content -->
  <text x="200" y="220" font-family="monospace" font-size="18" fill="#B8922A">></text>
  <text x="220" y="220" font-family="monospace" font-size="18" fill="#F2EAF0">
    EXECUTING: DIGITAL_ALCHEMY.sh --force --rage
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
  </text>
  
  <text x="200" y="250" font-family="monospace" font-size="14" fill="#8A7280">[STATUS: STABLE] [UPTIME: ∞] [VIBE: PEAK]</text>

  <defs>
    <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
