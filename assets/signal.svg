<svg width="1400" height="200" viewBox="0 0 1400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="1400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>
    <linearGradient id="sg-accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="200" rx="28" fill="url(#sg-bg)"/>

  <!-- Header -->
  <line x1="60" y1="36" x2="300" y2="36" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>
  <text x="320" y="42" fill="#B8922A" font-size="14" font-family="Consolas, Monaco, monospace" letter-spacing="6">CURRENT SIGNAL</text>
  <line x1="580" y1="36" x2="1340" y2="36" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>

  <!-- Signal Items -->
  <g font-family="Consolas, Monaco, monospace">
    <!-- Item 1 -->
    <circle cx="80" cy="80" r="4" fill="#C24F73">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="84" fill="#F2EAF0" font-size="15">Editing a new cinematic rage short</text>
    <text x="580" y="84" fill="#8A7280" font-size="12">🎥 VIDEO</text>

    <!-- Item 2 -->
    <circle cx="80" cy="112" r="4" fill="#B8922A">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="116" fill="#F2EAF0" font-size="15">Designing dark glass UI for a personal project</text>
    <text x="580" y="116" fill="#8A7280" font-size="12">🪟 DESIGN</text>

    <!-- Item 3 -->
    <circle cx="80" cy="144" r="4" fill="#8B1E47">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="148" fill="#F2EAF0" font-size="15">Recording angry Arabic dubs for upcoming drops</text>
    <text x="580" y="148" fill="#8A7280" font-size="12">🗣️ DUBBING</text>

    <!-- Item 4 -->
    <circle cx="80" cy="176" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="180" fill="#F2EAF0" font-size="15">Building interactive web rituals with HTML/CSS/JS</text>
    <text x="580" y="180" fill="#8A7280" font-size="12">⌘ CODE</text>
  </g>

  <!-- Right Side Status -->
  <rect x="1020" y="68" width="340" height="110" rx="16" fill="#0D090C" stroke="#2A1823"/>
  <text x="1190" y="98" text-anchor="middle" fill="#B8922A" font-size="13" font-family="Consolas, Monaco, monospace" letter-spacing="3">SYSTEM STATUS</text>
  <line x1="1050" y1="110" x2="1330" y2="110" stroke="#2A1823"/>

  <text x="1060" y="134" fill="#8A7280" font-size="12" font-family="Consolas, Monaco, monospace">UPTIME</text>
  <text x="1330" y="134" text-anchor="end" fill="#F2EAF0" font-size="12" font-family="Consolas, Monaco, monospace">Since 2023 · ∞</text>

  <text x="1060" y="158" fill="#8A7280" font-size="12" font-family="Consolas, Monaco, monospace">RAGE</text>
  <text x="1330" y="158" text-anchor="end" fill="#C24F73" font-size="12" font-family="Consolas, Monaco, monospace">MAXIMUM</text>
</svg>
