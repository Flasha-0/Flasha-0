<svg width="1400" height="380" viewBox="0 0 1400 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="50%" stop-color="#C24F73"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1400" height="380" fill="#0C080A" rx="40"/>

  <!-- Background Grid -->
  <g opacity="0.035">
    <rect width="1400" height="380" fill="url(#grid)" />
  </g>

  <!-- Big Orbs -->
  <circle cx="220" cy="140" r="135" fill="#8B1E47" opacity="0.13" filter="url(#glow)"/>
  <circle cx="1180" cy="260" r="160" fill="#B8922A" opacity="0.09" filter="url(#glow)"/>

  <!-- Rotating Rings -->
  <g transform="translate(170 130)">
    <circle cx="75" cy="75" r="88" fill="none" stroke="#B8922A" stroke-width="3" opacity="0.15"/>
    <circle cx="75" cy="75" r="88" fill="none" stroke="url(#crimson)" stroke-width="4" stroke-dasharray="60 280">
      <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Title -->
  <text x="720" y="175" font-family="Impact, Arial Black" font-size="138" font-weight="900" 
        fill="url(#crimson)" text-anchor="middle" filter="url(#textglow)" letter-spacing="-8">FLASHA</text>
  <text x="1050" y="172" font-size="92" filter="url(#glow)">🎴</text>

  <!-- Subtitle -->
  <text x="720" y="245" font-family="'SF Mono', monospace" font-size="21" 
        fill="#E6C467" text-anchor="middle" letter-spacing="9" opacity="0.95">
    CRIMSON RAGE PROTOCOL v6.0
  </text>

  <!-- Bottom Line -->
  <rect x="380" y="280" width="640" height="2" fill="url(#crimson)" opacity="0.4"/>
  
  <text x="720" y="315" font-family="'SF Mono', monospace" font-size="13" 
        fill="#C4A8B8" text-anchor="middle" letter-spacing="6">
    DIGITAL ALCHEMY • CONTROLLED REBELLION • GLASS ARCHITECTURE
  </text>
</svg>
