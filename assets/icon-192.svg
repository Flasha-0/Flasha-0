<svg xmlns="http://www.w3.org/2000/svg"
     width="192"
     height="192"
     viewBox="0 0 192 192">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Outer Ring -->
  <circle
    cx="96"
    cy="96"
    r="62"
    fill="none"
    stroke="url(#ring)"
    stroke-width="4"
    opacity="0.9"/>

  <!-- Inner Glow -->
  <circle
    cx="96"
    cy="96"
    r="48"
    fill="#8B1E47"
    opacity="0.12"
    filter="url(#glow)"/>

  <!-- Emoji -->
  <text
    x="96"
    y="110"
    text-anchor="middle"
    font-size="62"
    font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">
    🎴
  </text>

  <!-- Bottom Label -->
  <text
    x="96"
    y="168"
    text-anchor="middle"
    font-size="11"
    letter-spacing="4"
    fill="#B8922A"
    opacity="0.8"
    font-family="monospace">
    FLASHA
  </text>

</svg>
