<svg width="1400" height="240" viewBox="0 0 1400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="1400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="240" rx="28" fill="url(#ar-bg)"/>

  <!-- Header -->
  <line x1="60" y1="36" x2="280" y2="36" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>
  <text x="300" y="42" fill="#B8922A" font-size="14" font-family="Consolas, Monaco, monospace" letter-spacing="6">ARSENAL</text>
  <line x1="440" y1="36" x2="1340" y2="36" stroke="#8B1E47" stroke-width="1" opacity="0.4"/>

  <g font-family="Consolas, Monaco, monospace">
    <!-- Premiere -->
    <rect x="50" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="110" y="98" text-anchor="middle" fill="#9999FF" font-size="22">Pr</text>
    <text x="110" y="124" text-anchor="middle" fill="#8A7280" font-size="10">Premiere</text>

    <!-- After Effects -->
    <rect x="186" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="246" y="98" text-anchor="middle" fill="#9999FF" font-size="22">Ae</text>
    <text x="246" y="124" text-anchor="middle" fill="#8A7280" font-size="10">After Effects</text>

    <!-- Photoshop -->
    <rect x="322" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="382" y="98" text-anchor="middle" fill="#31A8FF" font-size="22">Ps</text>
    <text x="382" y="124" text-anchor="middle" fill="#8A7280" font-size="10">Photoshop</text>

    <!-- Illustrator -->
    <rect x="458" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="518" y="98" text-anchor="middle" fill="#FF9A00" font-size="22">Ai</text>
    <text x="518" y="124" text-anchor="middle" fill="#8A7280" font-size="10">Illustrator</text>

    <!-- CapCut -->
    <rect x="594" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="654" y="98" text-anchor="middle" fill="#00E5FF" font-size="22">✂</text>
    <text x="654" y="124" text-anchor="middle" fill="#8A7280" font-size="10">CapCut</text>

    <!-- Divider -->
    <line x1="740" y1="78" x2="740" y2="130" stroke="#2A1823" stroke-width="1"/>

    <!-- HTML -->
    <rect x="770" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="830" y="100" text-anchor="middle" fill="#E34F26" font-size="18" font-weight="700">&lt;/&gt;</text>
    <text x="830" y="124" text-anchor="middle" fill="#8A7280" font-size="10">HTML5</text>

    <!-- CSS -->
    <rect x="906" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="966" y="100" text-anchor="middle" fill="#1572B6" font-size="18" font-weight="700">#{ }</text>
    <text x="966" y="124" text-anchor="middle" fill="#8A7280" font-size="10">CSS3</text>

    <!-- JavaScript -->
    <rect x="1042" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="1102" y="100" text-anchor="middle" fill="#F7DF1E" font-size="18" font-weight="700">JS</text>
    <text x="1102" y="124" text-anchor="middle" fill="#8A7280" font-size="10">JavaScript</text>

    <!-- Git -->
    <rect x="1178" y="68" width="120" height="72" rx="14" fill="#140D12" stroke="#3A2431"/>
    <text x="1238" y="100" text-anchor="middle" fill="#F05032" font-size="18" font-weight="700">⎇</text>
    <text x="1238" y="124" text-anchor="middle" fill="#8A7280" font-size="10">Git</text>
  </g>

  <!-- Labels -->
  <text x="370" y="170" text-anchor="middle" fill="#8B1E47" font-size="11" font-family="Consolas, Monaco, monospace" letter-spacing="4" opacity="0.6">CREATIVE SUITE</text>
  <text x="1000" y="170" text-anchor="middle" fill="#B8922A" font-size="11" font-family="Consolas, Monaco, monospace" letter-spacing="4" opacity="0.6">DEVELOPMENT STACK</text>

  <!-- Bottom Line -->
  <rect x="60" y="200" width="1280" height="1" fill="#2A1823"/>
  <text x="700" y="224" text-anchor="middle" fill="#8A7280" font-size="10" font-family="Consolas, Monaco, monospace" letter-spacing="3">TOOLS OF CONTROLLED REBELLION</text>
</svg>
