<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110D10"/>
      <stop offset="100%" stop-color="#1A1018"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E47"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Soft Grid -->
  <g opacity="0.04" stroke="#8B1E47">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Glow -->
  <circle
    cx="256"
    cy="256"
    r="120"
    fill="#8B1E47"
    opacity="0.12"
    filter="url(#glow)"/>

  <!-- Main Ring -->
  <circle
    cx="256"
    cy="256"
    r="170"
    fill="none"
    stroke="url(#ring)"
    stroke-width="10"
    opacity="0.9"/>

  <!-- Accent Ring -->
  <circle
    cx="256"
    cy="256"
    r="145"
    fill="none"
    stroke="#B8922A"
    stroke-width="2"
    opacity="0.18"/>

  <!-- Emoji -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    font-size="180"
    font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">
    🎴
  </text>

  <!-- Label -->
  <text
    x="256"
    y="450"
    text-anchor="middle"
    font-size="28"
    letter-spacing="10"
    fill="#B8922A"
    opacity="0.85"
    font-family="monospace">
    FLASHA
  </text>

</svg>